title = "GNUS dashboard gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "hex-private-key"
description = "64-hex value, quoted or assigned, whatever its name"
regex = '''(?i)(["'`](0x)?[0-9a-f]{64}["'`]|[:=]\s*(0x)?[0-9a-f]{64}\b)'''

[[rules]]
id = "mnemonic-phrase"
description = "Quoted 12 or 24 word lowercase phrase (BIP-39 shape)"
regex = '''["'`]([a-z]{3,8} ){11}(([a-z]{3,8} ){12})?[a-z]{3,8}["'`]'''

[[rules]]
id = "sgns-key"
description = "SuperGenius account key"
regex = '''sgns_key["']?\s*[:=]\s*["'][0-9a-fA-F]{32,}'''

[[rules]]
id = "keyed-rpc-url"
description = "RPC endpoint URL carrying an API token"
regex = '''(?i)https?://[a-z0-9.-]*(blastapi\.io|infura\.io/v3|alchemy\.com/v2|quiknode\.pro)/[a-z0-9_-]{16,}'''

# Build and dependency output only. Source directories and .planning are never listed here.
[allowlist]
description = "build and dependency output"
paths = [
  '''^(\./)?node_modules([\/]|$)''',
  '''^(\./)?\.next([\/]|$)''',
  '''^(\./)?out([\/]|$)''',
  '''^(\./)?coverage([\/]|$)''',
  '''^(\./)?\.git([\/]|$)''',
  '''^(\./)?\.yarn[\/]releases([\/]|$)''',
  '''^(\./)?cypress[\/]screenshots([\/]|$)''',
  '''^(\./)?cypress[\/]videos([\/]|$)''',
  '''^(\./)?yarn\.lock$''',
]
