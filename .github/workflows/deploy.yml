name: Deploy to Cloudflare Pages

# Pushes to main publish production; a pull request from this repository publishes a preview at pr-<number>.
# Nothing here needs a person: until Cloudflare is configured the deploy step skips itself with a notice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the export. References no secret, so code from a pull request never shares a job with the token.
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }}
      - name: Check the export against the production headers
        run: node scripts/serve-out.js node scripts/check-deploy.js http://127.0.0.1:4173
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out
          if-no-files-found: error
          retention-days: 7

  # Holds the Cloudflare token. It downloads the built files and runs wrangler; it never checks out or runs repository code.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    outputs:
      url: ${{ steps.wrangler.outputs.deployment-url }}
      origin: ${{ vars.DASHBOARD_ORIGIN }}
    steps:
      - name: Look for the Cloudflare configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Cloudflare deploy skipped::Nothing was deployed because these are not set:$missing. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Variable: CLOUDFLARE_PAGES_PROJECT."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out
      - id: wrangler
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.154.0"
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}

  # Checks the deployment with the same script CI uses on the local server. References no secret.
  verify:
    needs: deploy
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the deployment
        run: node scripts/check-deploy.js "$DEPLOY_URL"
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
      - name: Check the production origin
        if: github.event_name == 'push' && needs.deploy.outputs.origin != ''
        run: node scripts/check-deploy.js "$DASHBOARD_ORIGIN"
        env:
          DASHBOARD_ORIGIN: ${{ needs.deploy.outputs.origin }}
