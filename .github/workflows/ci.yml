name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc -p tsconfig.strict.json
      - run: yarn lint
      - run: yarn build
      - run: yarn test --ci
      - name: Contract suite through the WalletConnect transport
        run: yarn test --ci __tests__/contract
        env:
          GNUS_CONTRACT_FACTORY: __tests__/contract/factories/walletconnect.js
      - run: yarn test:e2e
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bash scripts/check-secrets.sh
      - run: bash scripts/check-secrets.sh --self-test
      - name: Scan the commits this PR adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$BASE_SHA..HEAD"
      - run: node scripts/check-audit.js
      - run: bash scripts/check-secrets.sh --mock-import-test
